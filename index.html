<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SLy</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    color: #fff;
    overflow: hidden;

    /* ===== Background with overlay ===== */
    background:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.9)),
        url("bg.jpg.jpg") center / cover no-repeat fixed;
}

/* subtle noise overlay */
.noise {
    position: fixed;
    inset: 0;
    background-image: url("https://grainy-gradients.vercel.app/noise.svg");
    opacity: 0.08;
    z-index: -1;
    pointer-events: none;
}

/* ===== Card ===== */
.card {
    position: relative;
    background: rgba(255,255,255,0.06);
    padding: 40px 55px;
    border-radius: 22px;
    backdrop-filter: blur(18px);
    text-align: center;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
    z-index: 1;
}

h1 {
    font-weight: 300;
    letter-spacing: 3px;
    margin-bottom: 30px;
}

/* ===== Icons ===== */
.icons {
    display: flex;
    gap: 35px;
    justify-content: center;
}

.icon {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: #fff;
    text-decoration: none;
    transition: 0.4s ease;
    box-shadow: 0 0 25px rgba(0,0,0,0.8);
}

.icon:hover {
    transform: translateY(-10px) scale(1.12);
    box-shadow: 0 0 35px rgba(255,255,255,0.35);
}

.discord:hover { color: #5865F2; }
.instagram:hover { color: #E1306C; }

.username {
    margin-top: 10px;
    font-size: 13px;
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="noise"></div>

<div class="card">
    <h1>What?</h1>

    <div class="icons">
        <div>
            <a class="icon discord" href="#" title="Discord">
                <i class="fa-brands fa-discord"></i>
            </a>
            <div class="username">_3o_</div>
        </div>

        <div>
            <a class="icon instagram" href="https://instagram.com/x.3do" target="_blank" title="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <div class="username">x.3do</div>
        </div>
    </div>
</div>

<script>
/* ===== Mouse Parallax Effect ===== */
const card = document.querySelector('.card');
document.addEventListener("mousemove", (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 20;
    const y = (e.clientY / window.innerHeight - 0.5) * 20;
    card.style.transform = `translate(${x/2}px, ${y/2}px)`;
});
</script>

</body>
</html>
