<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>huh ?</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #0f0f0f, #000);
    color: #00ff9c;
    font-family: 'Share Tech Mono', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
}

.terminal {
    background: rgba(0,0,0,0.75);
    border: 1px solid #00ff9c;
    border-radius: 12px;
    width: 420px;
    padding: 25px;
    box-shadow: 0 0 25px #00ff9c55;
}

.header {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
}
.red { background: #ff5f56; }
.yellow { background: #ffbd2e; }
.green { background: #27c93f; }

h1 {
    font-size: 22px;
    margin: 10px 0;
}

p {
    font-size: 14px;
    line-height: 1.6;
    opacity: 0.9;
}

.btn {
    display: inline-block;
    margin-top: 18px;
    padding: 10px 22px;
    color: #000;
    background: #00ff9c;
    border-radius: 20px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    background: #fff;
    box-shadow: 0 0 15px #00ff9c;
}
</style>
</head>

<body>
<div class="terminal">
    <div class="header">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
    </div>

    <h1>root@slyx:~#</h1>
    <p>
        Welcome.<br>
        This page is live on GitHub Pages.<br>
        Status: <b>ONLINE</b>
    </p>

    <a>
        Access GitHub
    </a>
</div>
</body>
</html>
